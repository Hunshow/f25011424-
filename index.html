<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="李君豪的个人网页 - 上海杉达学院计算机科学与技术专业">
    <meta name="author" content="李君豪">
    <title>李君豪 | 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 720px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 40px;
            text-align: center;
        }

        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #4a90d9;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .student-id {
            color: #888;
            font-size: 16px;
            margin-bottom: 24px;
        }

        .info {
            text-align: left;
            margin-top: 10px;
        }

        .info p {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .info p:last-child {
            border-bottom: none;
        }

        .info strong {
            color: #4a90d9;
            display: inline-block;
            width: 90px;
        }

        footer {
            text-align: center;
            color: #aaa;
            font-size: 13px;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="photo.jpg" alt="李君豪的照片" class="avatar">
            <h1>李君豪</h1>
            <p class="student-id">学号：f25011424</p>
            <div class="info">
                <p><strong>学校</strong>上海杉达学院</p>
                <p><strong>专业</strong>计算机科学与技术</p>
                <p><strong>年级</strong>大二</p>
                <p><strong>爱好</strong>打篮球 🏀</p>
            </div>
        </div>
        <footer>
            <p>© 2026 李君豪 · <a href="https://github.com/Hunshow">GitHub: Hunshow</a></p>
        </footer>
    </div>
</body>
</html>
